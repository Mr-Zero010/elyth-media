<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>elyth — Home</title>

<meta name="description" content="Watch tutorials and videos on MyVideo. Sign in, upload, follow creators, and discover content.">

<style>
:root{
  --blue:#0be3ff;
  --muted:#6b7280;
  --bg:#ffffff;
  --card:#fff;
  --radius:12px;
  --max-width:980px;
  --shadow:0 6px 18px rgba(12,25,50,0.06);
}
.back-btn{
  background:#fff;
  border:1px solid #dbe3ea;
  color:#111;
  padding:8px 14px;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:16px;
  transition:all .15s ease;
}
.back-btn:hover{
  background:#f3f7fb;
  transform:translateX(-2px);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:#111}
a{color:inherit;text-decoration:none}
.app{max-width:var(--max-width);margin:0 auto;padding:14px 12px 110px}
header{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--blue);font-size:20px}
.logo svg{opacity:.95}
/* Search bar */
.search-bar{flex:1;display:flex;align-items:center;background:#f1f3f6;border-radius:24px;overflow:hidden;max-width:500px}
.search-bar input{flex:1;border:none;padding:8px 12px;font-size:15px;background:transparent;outline:none}
.search-bar button{background:var(--blue);border:none;color:white;padding:8px 14px;cursor:pointer}
/* Top actions */
.top-actions{display:flex;gap:8px;align-items:center}
button{cursor:pointer}
.btn{background:var(--blue);color:#fff;padding:8px 12px;border-radius:10px;border:0;font-weight:600}
.btn-ghost{background:white;border:1px solid #e6eefc;color:var(--blue);padding:6px 10px;border-radius:10px;font-weight:600}
.btn-ghost:hover{background:#f0f6ff}
/* Tabs */
.tabs{display:flex;gap:8px;margin:10px 0;overflow:auto;padding-bottom:6px}
.tab{padding:8px 12px;border-radius:20px;background:#f8fafc;font-weight:600;color:#111;white-space:nowrap}
.tab.active{background:var(--blue);color:#fff}
/* Shorts */
.shorts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.short{position:relative;border-radius:12px;overflow:hidden;height:170px;background:#eee;box-shadow:var(--shadow);cursor:pointer}
.short img{width:100%;height:100%;object-fit:cover;display:block}
.short .label{position:absolute;left:10px;bottom:8px;color:#fff;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.45)}
/* Video list */
.list{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.video-card{display:flex;gap:12px;padding:10px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);align-items:center}
.video-card:hover{transform:scale(1.01);transition:transform 0.15s ease}
.thumb{width:220px;height:120px;border-radius:8px;overflow:hidden;background:#ddd;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1}
.title{font-weight:700;margin:0 0 6px 0}
.desc{margin:0;color:var(--muted);font-size:14px}
.meta .small{color:var(--muted);font-size:13px;margin-top:6px}
/* Upload Panel */
#uploadPanel{display:none;flex-direction:column;gap:6px;margin-left:16px;max-width:320px;position:fixed;bottom:90px;right:20px;background:var(--card);padding:12px;border-radius:var(--radius);box-shadow:var(--shadow)}
#uploadPanel input,#uploadPanel textarea{padding:6px;border-radius:6px;border:1px solid #ccc;font-size:14px;font-family:inherit}
#uploadStatus{color:var(--muted);font-size:13px;min-height:18px}
/* Floating upload button */
#fabUpload{position:fixed;bottom:20px;right:20px;width:52px;height:52px;background:var(--blue);border-radius:50%;color:white;font-size:32px;line-height:52px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(11, 198, 255, 0.3)}
#fabUpload:hover{box-shadow:0 6px 18px rgba(11, 198, 255, 0.8);transform:scale(1.05);transition: transform 0.15s ease}
/* User page */
.user-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.user-header img{width:80px;height:80px;border-radius:50%}
.follow-count{color:var(--muted);font-size:14px;margin-left:8px}
/* ================================
   PROFILE TABS
================================ */

.profile-tabs{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-top:25px;
  border-bottom:1px solid #e5e7eb;
}

.profile-tab{
  background:none;
  border:none;
  padding:12px 5px;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  color:var(--muted);
  cursor:pointer;
  position:relative;
}

.profile-tab.active{
  color:#111;
}

.profile-tab.active::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:-1px;
  height:3px;
  background:var(--blue);
  border-radius:3px 3px 0 0;
}

.profile-tab:hover{
  color:#111;
}

/* VIDEO PAGE LAYOUT */
.video-page{padding:12px;max-width:100%}
.video-section{margin-bottom:24px}
.video-player-container{width:100%;max-height:480px;border-radius:10px;overflow:hidden;background:#000;margin:12px 0}
.video-player-container video{width:100%;height:auto;display:block}

.model-section{margin-top:24px;padding-top:24px;border-top:1px solid #e5e7eb}
.model-section h3{margin:0 0 12px 0;color:var(--blue);font-size:18px;font-weight:600}

.no-model-message{color:var(--muted);padding:20px;text-align:center;background:#f9fafb;border-radius:10px;font-size:14px}

/* 3D viewer within video page */
#viewer3d{width:100%;height:420px;background:#111;border-radius:10px;overflow:hidden}
/* ================================
   ELYTH BOTTOM NAVIGATION
================================ */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
  z-index:9999;
}

.nav-item{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#6b7280;
  font-size:12px;
  min-width:70px;
  height:60px;
}

.nav-item .nav-icon{
  font-size:22px;
  line-height:22px;
}

.nav-item.active{
  color:var(--blue);
  font-weight:700;
}

/* Upload button */
.nav-upload{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  background:var(--blue);
  color:white;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(11,198,255,.3);
}

/* Mobile */
@media (max-width:600px){

  .bottom-nav{
    justify-content:space-around;
    gap:0;
  }

  .nav-item{
    min-width:60px;
  }

}

function escapeHTML(s){ return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function getVideoList() {
  return document.getElementById('videoList');
}

function renderVideos(videos) {
  getVideoList().innerHTML = '';

  if (videos.length === 0) {
    getVideoList().innerHTML = '<p style="color:#888;">No videos found.</p>';
    return;
  }

  videos.forEach(v => {
    const card = document.createElement('div');
    card.className = 'video-card';
    card.innerHTML = `
      <div class="thumb"><img src="${v.thumbnailUrl || 'https://placehold.co/320x180/111/FFF?text=3D+Model'}" alt="${escapeHTML(v.title)}"></div>
      <div class="meta">
        <h3 class="title">${escapeHTML(v.title)}</h3>
        <p class="desc">${escapeHTML(v.description || '')}</p>
        <p class="small">By <a href="#" class="video-owner" data-owner="${v.ownerId}">${escapeHTML(v.ownerName || 'Unknown')}</a></p>
      </div>
    `;

    card.querySelector('.thumb').addEventListener('click', () => loadVideoPage(v.id));
    card.querySelector('.title').addEventListener('click', () => loadVideoPage(v.id));
    card.querySelector('.video-owner').addEventListener('click', e => {
      e.preventDefault();
      loadUserPage(v.ownerId);
    });

    getVideoList().appendChild(card);
  });
}

const videosCol = collection(db, 'videos');

onSnapshot(videosQuery, snap => {

});

function searchVideos() {
  const q = searchInput.value.toLowerCase();

    const desc = (c.querySelector('.desc')?.textContent || '').toLowerCase();
    c.style.display = (title.includes(q) || desc.includes(q)) ? 'flex' : 'none';
  });
}

let __threeInstance = null;

function load3DViewer(modelUrl) {
  if (__threeInstance && __threeInstance.cleanup) {
    try { __threeInstance.cleanup(); } catch (e) { console.warn(e); }
    __threeInstance = null;
  }

  const container = document.getElementById('viewer3d');
  if (!container) return;
  container.innerHTML = '';

  const width = container.clientWidth || 980;
  const height = container.clientHeight || 420;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

 const renderer = new THREE.WebGLRenderer({
  antialias: true
});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(width, height);
  renderer.setClearColor(0x111111, 1);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.shadowMap.enabled = true;
  container.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
  camera.position.set(0, 1.2, 3);


  // Better lighting
const ambient = new THREE.AmbientLight(0xffffff, 2);
scene.add(ambient);

const dirLight1 = new THREE.DirectionalLight(0xffffff, 3);
dirLight1.position.set(5, 5, 5);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0xffffff, 2);
dirLight2.position.set(-5, 3, -5);
scene.add(dirLight2);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.5;
  controls.maxDistance = 8;

  const dracoLoader = new DRACOLoader();

dracoLoader.setDecoderPath(
  'https://unpkg.com/three@0.163.0/examples/jsm/libs/draco/'
);

const loader = new GLTFLoader();

loader.setDRACOLoader(dracoLoader);
  let mixer = null;
  let modelRoot = null;

  console.log("Model URL:", modelUrl);

  loader.load(
  modelUrl,

  (gltf) => {

    modelRoot = gltf.scene || gltf.scenes?.[0];

    if (!modelRoot) {
      throw new Error("No scene in model");
    }


    const axes = new THREE.AxesHelper(5);
scene.add(axes);

const grid = new THREE.GridHelper(10, 10);
scene.add(grid);
    modelRoot.rotation.y = Math.PI / 4;
    console.log("MODEL ADDED TO SCENE");
 // Make model visible + safe material setup
modelRoot.traverse((child) => {

  if (!child.isMesh) return;

  child.visible = true;
  child.castShadow = true;
  child.receiveShadow = true;

  let materials = Array.isArray(child.material)
    ? child.material
    : [child.material];

  materials = materials.map((mat) => {

    // BAD / broken material
    if (
      !mat ||
      typeof mat !== "object" ||
      typeof mat.onBeforeCompile !== "function"
    ) {

      return new THREE.MeshStandardMaterial({
        color: 0xcccccc
      });
    }

    // Convert unsupported material types
    if (
      !(mat instanceof THREE.MeshStandardMaterial) &&
      !(mat instanceof THREE.MeshPhysicalMaterial) &&
      !(mat instanceof THREE.MeshPhongMaterial) &&
      !(mat instanceof THREE.MeshBasicMaterial)
    ) {

      return new THREE.MeshStandardMaterial({
        map: mat.map || null,
        color: mat.color || new THREE.Color(0xffffff)
      });
    }

    // Safe tweaks
    if ("metalness" in mat) {
      mat.metalness *= 0.7;
    }

    if ("roughness" in mat) {
      mat.roughness *= 1.1;
    }

    mat.needsUpdate = true;

    return mat;
  });

  child.material = Array.isArray(child.material)
    ? materials
    : materials[0];

});


   // AUTO CENTER MODEL
const box = new THREE.Box3().setFromObject(modelRoot);

const center = new THREE.Vector3();
box.getCenter(center);

const size = new THREE.Vector3();
box.getSize(size);

const maxAxis = Math.max(size.x, size.y, size.z);

console.log("MODEL SIZE:", size);
console.log("MAX AXIS:", maxAxis);

// SCALE FIRST
if (maxAxis > 0) {

  const scale = 2 / maxAxis;

  modelRoot.scale.setScalar(scale);

} else {

  modelRoot.scale.setScalar(1);

}

// RECALCULATE BOX AFTER SCALE
const newBox = new THREE.Box3().setFromObject(modelRoot);

const newCenter = new THREE.Vector3();
newBox.getCenter(newCenter);

// CENTER MODEL
modelRoot.position.set(
  -newCenter.x,
  -newCenter.y,
  -newCenter.z
);

scene.add(modelRoot);
console.log("SCENE:", scene);
console.log("MODEL:", modelRoot);
console.log("MODEL CHILDREN:", modelRoot.children.length);
console.log("FINAL POSITION:", modelRoot.position);
console.log("FINAL SCALE:", modelRoot.scale);
// RECALCULATE AFTER SCALE
const scaledBox = new THREE.Box3().setFromObject(modelRoot);

const scaledSize = scaledBox.getSize(new THREE.Vector3());

const finalMaxDim = Math.max(
  scaledSize.x,
  scaledSize.y,
  scaledSize.z
);

// CAMERA
camera.position.set(0, 1, 3);

camera.near = 0.01;
camera.far = 1000;

camera.lookAt(0, 0, 0);
controls.update();

camera.updateProjectionMatrix();

controls.target.set(0, 0, 0);
controls.update();

    // Animations
    if (gltf.animations?.length) {

      mixer = new THREE.AnimationMixer(modelRoot);

      gltf.animations.forEach((clip) => {
        mixer.clipAction(clip).play();
      });
    }
  },

  (xhr) => {

    if (xhr.total) {
      const percent = (xhr.loaded / xhr.total) * 100;
      console.log(`Loading: ${percent.toFixed(1)}%`);
    }
  },

  (err) => {

    console.error("Model load error:", err);

    container.innerHTML = `
      <div style="
        color:white;
        padding:20px;
        font-family:sans-serif;
      ">
        Failed to load 3D model
      </div>
    `;
  }
);

  function onResize() {
    if (!container) return;
    const w = container.clientWidth;
    const h = container.clientHeight;
    renderer.setSize(w, h);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);

  const clock = new THREE.Clock();
  let rafId = null;
 function animate() {

  rafId = requestAnimationFrame(animate);

  const dt = clock.getDelta();

  if (mixer) mixer.update(dt);

  controls.update();

  renderer.render(scene, camera);
}
  animate();

 __threeInstance = {
  cleanup: () => {

    if (rafId) {
      cancelAnimationFrame(rafId);
    }

    window.removeEventListener('resize', onResize);

    try {

      scene.traverse((obj) => {

        if (obj.geometry) {
          obj.geometry.dispose?.();
        }

        if (obj.material) {

          if (Array.isArray(obj.material)) {

            obj.material.forEach((m) => {

              if (m.map) m.map.dispose?.();

              m.dispose?.();

            });

          } else {

            if (obj.material.map) {
              obj.material.map.dispose?.();
            }

            obj.material.dispose?.();

          }
        }
      });

    } catch (e) {
      console.warn(e);
    }

    renderer.dispose();

    controls.dispose();

    dracoLoader.dispose();

    while (container.firstChild) {
      container.removeChild(container.firstChild);
    }
  }
};
}

async function uploadToR2(file, progressCallback = null) {

  const user = auth.currentUser;

  if (!user) {
    throw new Error("Not authenticated");
  }

  const token = await user.getIdToken(true);

  const safeName =
    Date.now() +
    "_" +
    (file.name || "file")
      .replace(/[^a-zA-Z0-9._-]/g, "");

  // START MULTIPART
  const startRes = await fetch(
  R2_UPLOAD_ENDPOINT + "/create-upload",
  {
     method: "POST",

      headers: {
        "Authorization": "Bearer " + token,
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        fileName: safeName,
        contentType:
          file.type || "application/octet-stream"
      })
    }
  );

  if (!startRes.ok) {
    throw new Error(
      "Failed to start multipart upload"
    );
  }

  const startData = await startRes.json();

  const uploadId = startData.uploadId;
  const key = startData.key;

  // BIGGER chunks = MUCH faster
const CHUNK_SIZE = 50 * 1024 * 1024;

const parts = [];

const uploadPromises = [];

let uploadedBytes = 0;

const totalParts = Math.ceil(
  file.size / CHUNK_SIZE
);

for (
  let partNumber = 1;
  partNumber <= totalParts;
  partNumber++
) {

  const start =
    (partNumber - 1) * CHUNK_SIZE;

  const end = Math.min(
    start + CHUNK_SIZE,
    file.size
  );

  const chunk = file.slice(start, end);

  const promise = fetch(
    R2_UPLOAD_ENDPOINT + "/upload-part",
    {
      method: "PUT",

      headers: {
        "Authorization":
          "Bearer " + token,

        "x-upload-id":
          uploadId,

        "x-part-number":
          String(partNumber),

        "x-key":
          key,

        "Content-Type":
          "application/octet-stream"
      },

      body: chunk
    }
  )
  .then(async (uploadRes) => {

    if (!uploadRes.ok) {

      throw new Error(
        "Chunk upload failed at part " +
        partNumber
      );

    }

    const uploadData =
      await uploadRes.json();

    uploadedBytes +=
      (end - start);

    let percent = Math.round(
      (uploadedBytes / file.size) * 100
    );

    if (percent > 98) {
      percent = 98;
    }

    if (progressCallback) {
      progressCallback(percent);
    }

    return {
      partNumber,
      etag: uploadData.etag
    };
  });

  uploadPromises.push(promise);
}

// Upload ALL parts in parallel
const uploadedParts =
  await Promise.all(uploadPromises);

// IMPORTANT: sort parts
uploadedParts.sort(
  (a, b) =>
    a.partNumber - b.partNumber
);

parts.push(...uploadedParts);

  // COMPLETE MULTIPART
  const completeRes = await fetch(
  R2_UPLOAD_ENDPOINT +
    "/complete-upload",
    {
      method: "POST",

      headers: {
        "Authorization":
          "Bearer " + token,

        "Content-Type":
          "application/json"
      },

      body: JSON.stringify({
        uploadId,
        key,
        parts
      })
    }
  );

  if (!completeRes.ok) {

    throw new Error(
      "Failed to complete upload"
    );

  }

  const completeData =
    await completeRes.json();

  if (progressCallback) {
    progressCallback(100);
  }

  return {
    url: completeData.url,
    key: completeData.key
  };
}
function generateThumbnailBlob(file, width = 320, height = 180, seekTo = 0.5) {
  return new Promise((resolve, reject) => {

  const timeout = setTimeout(() => {
    cleanup();
    reject(new Error("Thumbnail timeout"));
  }, 10000);

    const url = URL.createObjectURL(file);

    const video = document.createElement("video");

    video.preload = "auto";
    video.src = url;
    video.muted = true;
    video.playsInline = true;

    const cleanup = () => {
  clearTimeout(timeout);
  URL.revokeObjectURL(url);

  video.removeAttribute("src");
  video.load();
};

    video.addEventListener("loadedmetadata", () => {

      const target = Math.min(
        seekTo,
        Math.max(0, video.duration || 0)
      );

      video.currentTime = target;

    }, { once: true });

    video.addEventListener("seeked", () => {

      try {

        const canvas = document.createElement("canvas");

        const vw = video.videoWidth || width;
        const vh = video.videoHeight || height;

        const aspect = vw / vh;

        let cw = width;
        let ch = Math.round(width / aspect);

        if (ch > height) {
          ch = height;
          cw = Math.round(height * aspect);
        }

        canvas.width = cw;
        canvas.height = ch;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(video, 0, 0, cw, ch);

       canvas.toBlob(
  (blob) => {

    cleanup();

    if (blob) {
      resolve(blob);
    } else {
      reject(new Error("Thumbnail generation failed"));
    }

  },
  "image/jpeg",
  0.82
);

      } catch (err) {

  cleanup();
  reject(err);

}

    }, { once: true });

    video.addEventListener("error", (e) => {

  cleanup();
  reject(e);

}, { once: true });

});

        <h3>🎨 3D Model Viewer</h3>
        <div id="viewer3d"></div>
      </div>
    `;
  } else if (v.videoUrl) {
    // Only show "not available" if there's a video but NO model
    html += `
      <div class="model-section">
        <div class="no-model-message">
          📦 3D Model not available for this video
        </div>
      </div>
    `;
  }

  html += `</div>`;
  contentArea.innerHTML = html;
  const backBtn = document.getElementById('backBtn');

if (backBtn) {
  backBtn.addEventListener('click', () => {
    goHome();
  });
}

  /* ---------- DELETE VIDEO LOGIC ---------- */
  const deleteBtn = document.getElementById("deleteVideoBtn");
  if (deleteBtn) {
    deleteBtn.addEventListener("click", async () => {
      if (!confirm("Delete this permanently?")) return;

      try {
        const token = await auth.currentUser.getIdToken(true);
        const keys = [];
        if (v.videoKey) keys.push(v.videoKey);
        if (v.modelKey) keys.push(v.modelKey);
        if (v.thumbnailKey) keys.push(v.thumbnailKey);

        for (const key of keys) {
          const res = await fetch(R2_UPLOAD_ENDPOINT, {
            method: "DELETE",
            headers: {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ key })
          });

          if (!res.ok) {
            throw new Error("R2 delete failed: " + key);
           }
        }

        await deleteDoc(doc(db, "videos", videoId));
        alert("Deleted");
        goHome();

      } catch (err) {
        console.error(err);
        alert("Delete failed: " + err.message);
      }
    });
  }

  // Wire owner link
  const ownerLink = document.getElementById('videoOwner');
  if (ownerLink) {
    ownerLink.addEventListener('click', e => {
      e.preventDefault();
      loadUserPage(v.ownerId);
    });
  }

  // Initialize 3D viewer if model exists
  if (v.modelUrl) {
    setTimeout(() => {
      load3DViewer(v.modelUrl);
    }, 100);
  }
}

async function goHome() {

  contentArea.innerHTML = `
    <div class="list" id="videoList"></div>
  `;

  const snap = await getDocs(
    query(
      collection(db, "videos"),
      orderBy("uploadDate", "desc")
    )
  );

  const videos = snap.docs.map(d => ({
    id: d.id,
    ...d.data()
  }));

  renderVideos(videos);
}

document.addEventListener('DOMContentLoaded', () => {
  // Nothing special needed
});

</script>
</body>
</html>
