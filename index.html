<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>elyth — Home</title>

<meta name="description" content="Watch tutorials and videos on MyVideo. Sign in, upload, follow creators, and discover content.">

<style>
:root{
  --blue:#0be3ff;
  --muted:#6b7280;
  --bg:#ffffff;
  --card:#fff;
  --radius:12px;
  --max-width:980px;
  --shadow:0 6px 18px rgba(12,25,50,0.06);
}
.back-btn{
  background:#fff;
  border:1px solid #dbe3ea;
  color:#111;
  padding:8px 14px;
  border-radius:10px;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  margin-bottom:16px;
  transition:all .15s ease;
}
.back-btn:hover{
  background:#f3f7fb;
  transform:translateX(-2px);
}

*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;color:#111}
a{color:inherit;text-decoration:none}
.app{max-width:var(--max-width);margin:0 auto;padding:14px 12px 110px}
header{display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--blue);font-size:20px}
.logo svg{opacity:.95}
/* Search bar */
.search-bar{flex:1;display:flex;align-items:center;background:#f1f3f6;border-radius:24px;overflow:hidden;max-width:500px}
.search-bar input{flex:1;border:none;padding:8px 12px;font-size:15px;background:transparent;outline:none}
.search-bar button{background:var(--blue);border:none;color:white;padding:8px 14px;cursor:pointer}
/* Top actions */
.top-actions{display:flex;gap:8px;align-items:center}
button{cursor:pointer}
.btn{background:var(--blue);color:#fff;padding:8px 12px;border-radius:10px;border:0;font-weight:600}
.btn-ghost{background:white;border:1px solid #e6eefc;color:var(--blue);padding:6px 10px;border-radius:10px;font-weight:600}
.btn-ghost:hover{background:#f0f6ff}
/* Tabs */
.tabs{display:flex;gap:8px;margin:10px 0;overflow:auto;padding-bottom:6px}
.tab{padding:8px 12px;border-radius:20px;background:#f8fafc;font-weight:600;color:#111;white-space:nowrap}
.tab.active{background:var(--blue);color:#fff}
/* Shorts */
.shorts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.short{position:relative;border-radius:12px;overflow:hidden;height:170px;background:#eee;box-shadow:var(--shadow);cursor:pointer}
.short img{width:100%;height:100%;object-fit:cover;display:block}
.short .label{position:absolute;left:10px;bottom:8px;color:#fff;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,0.45)}
/* Video list */
.list{margin-top:12px;display:flex;flex-direction:column;gap:12px}
.video-card{display:flex;gap:12px;padding:10px;border-radius:10px;background:var(--card);box-shadow:var(--shadow);align-items:center}
.video-card:hover{transform:scale(1.01);transition:transform 0.15s ease}
.thumb{width:220px;height:120px;border-radius:8px;overflow:hidden;background:#ddd;flex-shrink:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.meta{flex:1}
.title{font-weight:700;margin:0 0 6px 0}
.desc{margin:0;color:var(--muted);font-size:14px}
.meta .small{color:var(--muted);font-size:13px;margin-top:6px}
/* Upload Panel */
#uploadPanel{display:none;flex-direction:column;gap:6px;margin-left:16px;max-width:320px;position:fixed;bottom:90px;right:20px;background:var(--card);padding:12px;border-radius:var(--radius);box-shadow:var(--shadow)}
#uploadPanel input,#uploadPanel textarea{padding:6px;border-radius:6px;border:1px solid #ccc;font-size:14px;font-family:inherit}
#uploadStatus{color:var(--muted);font-size:13px;min-height:18px}
/* Floating upload button */
#fabUpload{position:fixed;bottom:20px;right:20px;width:52px;height:52px;background:var(--blue);border-radius:50%;color:white;font-size:32px;line-height:52px;text-align:center;cursor:pointer;box-shadow:0 4px 12px rgba(11, 198, 255, 0.3)}
#fabUpload:hover{box-shadow:0 6px 18px rgba(11, 198, 255, 0.8);transform:scale(1.05);transition: transform 0.15s ease}
/* User page */
.user-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.user-header img{width:80px;height:80px;border-radius:50%}
.follow-count{color:var(--muted);font-size:14px;margin-left:8px}

/* VIDEO PAGE LAYOUT */
.video-page{padding:12px;max-width:100%}
.video-section{margin-bottom:24px}
.video-player-container{width:100%;max-height:480px;border-radius:10px;overflow:hidden;background:#000;margin:12px 0}
.video-player-container video{width:100%;height:auto;display:block}

.model-section{margin-top:24px;padding-top:24px;border-top:1px solid #e5e7eb}
.model-section h3{margin:0 0 12px 0;color:var(--blue);font-size:18px;font-weight:600}

.no-model-message{color:var(--muted);padding:20px;text-align:center;background:#f9fafb;border-radius:10px;font-size:14px}

/* 3D viewer: the WebGL canvas and object panel are independent layers */
#viewer3d {
  position: relative;
  display: block;
  isolation: isolate;
  width: 100%;
  height: 420px;
  min-height: 420px;
  background: #111;
  border-radius: 10px;
  overflow: hidden;
}

#viewerCanvas {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
}

#viewerCanvas canvas {
  display: block;
  width: 100%;
  height: 100%;
}

#modelObjects {
  position: absolute;
  z-index: 10;
  top: 0;
  right: 0;
  box-sizing: border-box;
  width: var(--object-panel-size, 190px);
  height: 100%;
  min-height: 0;
  padding: 14px;
  color: white;
  background: rgba(25, 25, 25, .97);
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  border-left: 1px solid #383838;
}

#viewerFullscreenBtn {
  position: absolute;
  top: 12px;
  left: 12px;
  z-index: 20;
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 8px;
  padding: 8px 11px;
  color: #fff;
  background: rgba(0,0,0,.72);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}

#viewerFullscreenBtn:hover {
  background: rgba(35,35,35,.95);
}

#viewer3d:fullscreen {
  display: block;
  width: 100vw;
  height: 100vh;
  min-height: 100vh;
  border-radius: 0;
  background: #111;
}

#viewer3d:fullscreen #viewerCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
}

#viewer3d:fullscreen #modelObjects {
  top: 0;
  right: 0;
  width: var(--object-panel-size, 190px);
  height: 100%;
  max-height: none;
}

#viewer3d:fullscreen #viewerFullscreenBtn {
  top: 16px;
  left: 16px;
  right: auto;
}

#modelObjects h4 {
  margin: 0 0 12px;
  color: var(--blue);
}

.object-panel-controls {
  position: sticky;
  top: -14px;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: -14px -14px 10px;
  padding: 12px 14px 10px;
  background: #191919;
  border-bottom: 1px solid #333;
}

.object-panel-controls h4 {
  margin: 0;
  min-width: 0;
}

.object-panel-resize-handle {
  position: static;
  flex: 0 0 34px;
  width: 34px;
  height: 32px;
  padding: 0;
  transform: none;
  border: 1px solid #444;
  border-radius: 7px;
  color: var(--blue);
  background: #292929;
  font: 700 22px/1 sans-serif;
  cursor: col-resize;
  touch-action: none;
  user-select: none;
}

.object-panel-resize-handle:hover {
  background: #383838;
}

.model-object-row {
  display: flex;
  align-items: stretch;
  gap: 5px;
  width: 100%;
  margin-bottom: 5px;
}

.model-object-name {
  display: block;
  flex: 1 1 auto;
  min-width: 0;
  padding: 8px;
  border-radius: 6px;
  background: #252525;
  box-sizing: border-box;
  color: #fff;
  font: inherit;
  font-size: 13px;
  text-align: left;
  overflow-wrap: anywhere;
  cursor: pointer;
  border: 1px solid transparent;
  transition: background .12s ease, border-color .12s ease;
}

.model-object-name:hover {
  background: #343434;
}

.model-object-name.is-selected {
  background: rgba(11, 227, 255, .14);
  border-color: var(--blue);
  color: #fff;
}

.model-object-visibility {
  flex: 0 0 34px;
  width: 34px;
  min-height: 34px;
  padding: 4px;
  border: 1px solid #444;
  border-radius: 6px;
  color: var(--blue);
  background: #252525;
  font-size: 17px;
  cursor: pointer;
}

.model-object-visibility:hover {
  background: #383838;
}

.model-object-visibility[aria-pressed="false"] {
  color: #888;
  background: #1d1d1d;
}

.model-object-row.is-hidden .model-object-name {
  color: #888;
  opacity: .7;
}

@media (max-width: 600px) {
  #viewer3d {
    height: 420px;
    min-height: 420px;
  }

  #modelObjects {
    top: auto;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: var(--object-panel-size, 30vh);
    max-height: 65%;
    min-height: 90px;
    border-left: 0;
    border-top: 1px solid #383838;
  }

  .object-panel-controls {
    flex-direction: column;
    align-items: stretch;
  }

  .object-panel-resize-handle {
    flex: 0 0 28px;
    width: 100%;
    height: 28px;
    cursor: row-resize;
    font-size: 20px;
  }

  #viewer3d:fullscreen {
    height: 100vh;
    min-height: 100vh;
  }

  #viewer3d:fullscreen #modelObjects {
    top: auto;
    right: 0;
    bottom: 0;
    left: 0;
    width: 100%;
    height: var(--object-panel-size, 30vh);
    max-height: 65vh;
    min-height: 90px;
    border-top: 1px solid #383838;
  }

  #viewer3d:fullscreen #viewerFullscreenBtn {
    top: 12px;
    left: 12px;
  }
}




/* Compact multi-object isolate control */
#objectSelectionToolbar {
  position: absolute;
  z-index: 25;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: 9px;
  max-width: calc(100% - 150px);
  padding: 6px 9px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 999px;
  color: #fff;
  background: rgba(20,20,20,.94);
  box-shadow: 0 3px 14px rgba(0,0,0,.3);
  font: 12px/1.2 Arial, sans-serif;
}
#objectSelectionToolbar.is-visible { display: flex; }
#objectSelectionCount { white-space: nowrap; color: #ddd; }
#hideRemainingToggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border: 1px solid #4a4a4a;
  border-radius: 999px;
  color: #fff;
  background: #292929;
  font: inherit;
  white-space: nowrap;
  cursor: pointer;
}
#hideRemainingToggle:hover { background: #383838; }
#objectSelectionCount { cursor: help; }
#hideRemainingToggle .isolate-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #777;
  box-shadow: 0 0 0 2px rgba(255,255,255,.08);
}
#hideRemainingToggle[aria-pressed="true"] {
  border-color: var(--blue);
  color: var(--blue);
}
#hideRemainingToggle[aria-pressed="true"] .isolate-dot {
  background: var(--blue);
  box-shadow: 0 0 7px rgba(11,227,255,.8);
}
#clearObjectSelection {
  width: 22px;
  height: 22px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  color: #bbb;
  background: transparent;
  font: 16px/1 Arial, sans-serif;
  cursor: pointer;
}
#clearObjectSelection:hover { color: #fff; background: #444; }
.model-object-visibility:disabled { opacity: .35; cursor: not-allowed; }
@media (max-width: 600px) {
  #objectSelectionToolbar { top: 10px; max-width: calc(100% - 125px); gap: 6px; padding: 5px 7px; }
  #objectSelectionCount { font-size: 11px; }
  #hideRemainingToggle { padding: 5px 7px; font-size: 11px; }
}

/* Imported animation playback controls */
#animationControls {
  position: absolute;
  z-index: 15;
  left: 12px;
  bottom: 12px;
  width: min(360px, calc(100% - 24px));
  box-sizing: border-box;
  padding: 11px;
  border: 1px solid rgba(255,255,255,.16);
  border-radius: 10px;
  color: #fff;
  background: rgba(20,20,20,.94);
  box-shadow: 0 4px 18px rgba(0,0,0,.28);
  font: 13px/1.35 Arial, sans-serif;
}

#animationControls .animation-top-row,
#animationControls .animation-button-row,
#animationControls .animation-meta-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

#animationControls .animation-top-row { margin-bottom: 9px; }
#animationControls .animation-top-row label { flex: 0 0 auto; color: #bdbdbd; }
#animationControls select,
#animationControls button {
  min-width: 0;
  border: 1px solid #454545;
  border-radius: 6px;
  color: #fff;
  background: #292929;
  font: inherit;
}
#animationControls select { flex: 1 1 auto; padding: 6px 7px; }
#animationControls button { padding: 6px 10px; cursor: pointer; }
#animationControls button:hover,
#animationControls select:hover { background: #383838; }
#animationControls button:focus-visible,
#animationControls select:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
#animationControls .animation-button-row { margin-bottom: 9px; }
#animationControls .animation-play { color: #071518; background: var(--blue); border-color: var(--blue); font-weight: 700; }
#animationControls .animation-loop[aria-pressed="true"] { color: var(--blue); border-color: var(--blue); }
#animationControls .animation-speed { margin-left: auto; flex: 0 0 auto; }
#animationControls .animation-progress-track {
  height: 5px;
  overflow: hidden;
  border-radius: 99px;
  background: #484848;
}
#animationControls .animation-progress-fill {
  width: 0%;
  height: 100%;
  border-radius: inherit;
  background: var(--blue);
}
#animationControls .animation-meta-row {
  justify-content: space-between;
  margin-top: 5px;
  color: #c7c7c7;
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 600px) {
  #animationControls {
    top: 56px;
    bottom: auto;
    left: 10px;
    width: min(340px, calc(100% - 20px));
    padding: 9px;
  }
}

/* Pause-only object transform controls */
#objectTransformToolbar {
  position: absolute;
  z-index: 24;
  top: 54px;
  left: 12px;
  display: none;
  align-items: center;
  gap: 6px;
  padding: 7px;
  border: 1px solid rgba(255,255,255,.2);
  border-radius: 9px;
  color: #fff;
  background: rgba(20,20,20,.95);
  box-shadow: 0 3px 14px rgba(0,0,0,.3);
  font: 12px/1.2 Arial, sans-serif;
}
#objectTransformToolbar.is-visible { display: flex; }
#objectTransformToolbar button {
  padding: 6px 9px;
  border: 1px solid #454545;
  border-radius: 6px;
  color: #fff;
  background: #292929;
  font: inherit;
  cursor: pointer;
}
#objectTransformToolbar button:hover { background: #383838; }
#objectTransformToolbar button.is-active {
  border-color: var(--blue);
  color: var(--blue);
}
#objectTransformToolbar .transform-hint {
  color: #aaa;
  white-space: nowrap;
}
@media (max-width: 600px) {
  #objectTransformToolbar {
    top: 210px;
    left: 10px;
    gap: 4px;
    padding: 6px;
  }
  #objectTransformToolbar button { padding: 6px 7px; }
  #objectTransformToolbar .transform-hint { display: none; }
}

/* ================================
   ELYTH BOTTOM NAVIGATION
================================ */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:70px;
  background:#fff;
  border-top:1px solid #e5e7eb;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:40px;
  z-index:9999;
}

.nav-item{
  background:none;
  border:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
  color:#6b7280;
  font-size:12px;
  min-width:70px;
  height:60px;
}

.nav-item .nav-icon{
  font-size:22px;
  line-height:22px;
}

.nav-item.active{
  color:var(--blue);
  font-weight:700;
}

/* Upload button */
.nav-upload{
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  background:var(--blue);
  color:white;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 4px 12px rgba(11,198,255,.3);
}

/* Mobile */
@media (max-width:600px){

  .bottom-nav{
    justify-content:space-around;
    gap:0;
  }

  .nav-item{
    min-width:60px;
  }

}
</style>
<body>

<div class="app">
  <header>
    <div class="logo">
      <svg width="24" height="24"><circle cx="12" cy="12" r="10" fill="var(--blue)"/></svg>
      elyth
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search videos..." />
      <button id="searchBtn">🔍</button>
    </div>

    <div class="top-actions">
      <button id="authBtn" class="btn">Sign in</button>
    </div>
  </header>

  <div id="contentArea">
    <div class="list" id="videoList">
      <!-- videos on home page -->
    </div>
  </div>
</div>

<!-- Floating Upload Button -->
<!-- Bottom Navigation -->

<nav class="bottom-nav">

  <button
    id="navHome"
    class="nav-item active"
    aria-label="Home"
  >
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </button>


  <button
    id="navUpload"
    class="nav-upload"
    aria-label="Upload"
  >
    +
  </button>


  <button
    id="navProfile"
    class="nav-item"
    aria-label="Profile"
  >
    <span class="nav-icon">👤</span>
    <span>Profile</span>
  </button>

</nav>

<!-- Upload Panel -->
<div id="uploadPanel">
  <input id="uploadTitle" type="text" placeholder="Title (video or model)" />
  <textarea id="uploadDescription" placeholder="Description" rows="2"></textarea>
  <input id="uploadKeywords" type="text" placeholder="Keywords (comma separated, e.g. biology, cells, 3D)" />
  <small style="color:#888;display:block;margin:4px 0 10px;">Add keywords to help people find your content.</small>
  <input id="uploadVideo" type="file" accept="video/*" />
  <input id="uploadModel" type="file" accept=".glb,.gltf" />
  <button id="uploadSubmit" class="btn">Upload</button>
  <small id="uploadStatus"></small>
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.163.0/build/three.module.js";

import { OrbitControls } from "https://unpkg.com/three@0.163.0/examples/jsm/controls/OrbitControls.js?module";
import { TransformControls } from "https://unpkg.com/three@0.163.0/examples/jsm/controls/TransformControls.js?module";

import { GLTFLoader } from "https://unpkg.com/three@0.163.0/examples/jsm/loaders/GLTFLoader.js?module";

import { DRACOLoader } from "https://unpkg.com/three@0.163.0/examples/jsm/loaders/DRACOLoader.js?module";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  collection,
  setDoc,
  getDoc,
  getDocs,
  addDoc,
  updateDoc,
  deleteDoc,
  arrayUnion,
  arrayRemove,
  query,
  where,
  orderBy,
  serverTimestamp,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD62Ox1iEF9yJ6OJiI-_KX6HO98A11pcg8",
  authDomain: "elyth-3e386.firebaseapp.com",
  projectId: "elyth-3e386",
  storageBucket: "elyth-3e386.firebasestorage.app",
  messagingSenderId: "800140672961",
  appId: "1:800140672961:web:b32ef20a0b8140fccd7940",
  measurementId: "G-KV2RMG0YMH"
};

const R2_UPLOAD_ENDPOINT = "https://elyth.zerogroupofficial00.workers.dev";

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
const db = getFirestore(app);

const authBtn = document.getElementById('authBtn');
const navHome = document.getElementById('navHome');
const navUpload = document.getElementById('navUpload');
const navProfile = document.getElementById('navProfile');
const uploadPanel = document.getElementById('uploadPanel');
const uploadTitle = document.getElementById('uploadTitle');
const uploadDescription = document.getElementById('uploadDescription');
const uploadKeywords = document.getElementById('uploadKeywords');
const uploadVideo = document.getElementById('uploadVideo');
const uploadModel = document.getElementById('uploadModel');
const uploadSubmit = document.getElementById('uploadSubmit');
const uploadStatus = document.getElementById('uploadStatus');
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const contentArea = document.getElementById('contentArea');

let currentUser = null;

authBtn.addEventListener('click', async () => {
  if (!currentUser) {
    try {
      await signInWithPopup(auth, provider);
    } catch (e) {
      alert('Sign-in failed: ' + e.message);
    }
  } else {
    try {
      await signOut(auth);
    } catch (e) {
      console.error(e);
    }
  }
});

function renderVideos(videos) {
  getVideoList().innerHTML = '';

  if (videos.length === 0) {
    getVideoList().innerHTML = '<p style="color:#888;">No videos found.</p>';
    return;
  }

  videos.forEach(v => {
    if (!Array.isArray(v.keywords)) v.keywords = [];
    if (!v.category || !Array.isArray(v.categories)) {
      const detected = detectCategories(v.title, v.description, v.keywords);
      if (!v.category) v.category = detected.category;
      if (!Array.isArray(v.categories)) v.categories = detected.categories;
    }

    const card = document.createElement('div');
    card.className = 'video-card';
    card.__videoData = v;
    card.innerHTML = `
      <div class="thumb"><img src="${v.thumbnailUrl || 'https://placehold.co/320x180/111/FFF?text=3D+Model'}" alt="${escapeHTML(v.title)}"></div>
      <div class="meta">
        <h3 class="title">${escapeHTML(v.title)}</h3>
        <p class="desc">${escapeHTML(v.description || '')}</p>
        <p class="small">${escapeHTML(v.category || 'General')} · By <a href="#" class="video-owner" data-owner="${v.ownerId}">${escapeHTML(v.ownerName || 'Unknown')}</a></p>
      </div>
    `;

    card.querySelector('.thumb').addEventListener('click', () => loadVideoPage(v.id));
    card.querySelector('.title').addEventListener('click', () => loadVideoPage(v.id));
    card.querySelector('.video-owner').addEventListener('click', e => {
      e.preventDefault();
      loadUserPage(v.ownerId);
    });

    getVideoList().appendChild(card);
  });
}

/*
  Automatic category detection.
  The uploader's keywords are strongest, then title + description are used
  as extra signals. This creates a primary category plus all matching categories.
*/
const CATEGORY_RULES = {
  Biology: ['biology', 'cell', 'cells', 'dna', 'rna', 'genetics', 'anatomy', 'physiology', 'microbiology', 'organism', 'evolution', 'botany', 'zoology'],
  Chemistry: ['chemistry', 'chemical', 'atom', 'molecule', 'molecular', 'reaction', 'organic chemistry', 'inorganic', 'periodic table', 'compound'],
  Physics: ['physics', 'force', 'motion', 'energy', 'gravity', 'quantum', 'relativity', 'electricity', 'magnetism', 'wave', 'mechanics', 'thermodynamics'],
  Mathematics: ['math', 'mathematics', 'algebra', 'geometry', 'calculus', 'trigonometry', 'statistics', 'probability', 'equation', 'theorem'],
  "Computer Science": ['computer science', 'programming', 'coding', 'code', 'javascript', 'python', 'html', 'css', 'algorithm', 'software', 'database', 'machine learning', 'ai', 'artificial intelligence'],
  Engineering: ['engineering', 'mechanical', 'electrical engineering', 'civil engineering', 'electronics', 'robotics', 'cad', 'circuit', 'thermodynamics'],
  "3D": ['3d', '3d model', 'model', 'blender', 'cad', 'gltf', 'glb', 'sculpting', 'rendering', 'animation'],
  Space: ['space', 'astronomy', 'astrophysics', 'planet', 'planets', 'star', 'stars', 'galaxy', 'galaxies', 'cosmos', 'universe', 'nasa'],
  History: ['history', 'historical', 'ancient', 'civilization', 'empire', 'archaeology', 'war', 'culture'],
  Geography: ['geography', 'geology', 'earth', 'map', 'maps', 'continent', 'climate', 'landform', 'ocean'],
  Medicine: ['medicine', 'medical', 'health', 'disease', 'diagnosis', 'surgery', 'clinical', 'pharmacy'],
  Education: ['education', 'tutorial', 'lesson', 'lecture', 'course', 'study', 'learning', 'explained', 'how to']
};

function detectCategories(title, description, keywords) {
  const keywordText = (Array.isArray(keywords) ? keywords : []).join(' ').toLowerCase();
  const titleText = String(title || '').toLowerCase();
  const descriptionText = String(description || '').toLowerCase();
  const fullText = `${titleText} ${descriptionText}`;

  const scores = [];

  for (const [category, terms] of Object.entries(CATEGORY_RULES)) {
    let score = 0;

    for (const term of terms) {
      if (keywordText.includes(term)) score += 6;
      if (titleText.includes(term)) score += 4;
      if (descriptionText.includes(term)) score += 2;
    }

    if (score > 0) scores.push({ category, score });
  }

  scores.sort((a, b) => b.score - a.score);

  return {
    category: scores[0]?.category || 'General',
    categories: scores.slice(0, 3).map(x => x.category)
  };
}

function getSearchTerms(value) {
  return String(value || '')
    .toLowerCase()
    .trim()
    .split(/\s+/)
    .filter(Boolean);
}

function scoreVideo(v, searchText) {
  const terms = getSearchTerms(searchText);
  if (terms.length === 0) return 0;

  const title = String(v.title || '').toLowerCase();
  const description = String(v.description || '').toLowerCase();
  const keywords = Array.isArray(v.keywords) ? v.keywords.map(k => String(k).toLowerCase()) : [];
  const categories = Array.isArray(v.categories) ? v.categories.map(c => String(c).toLowerCase()) : [];
  const category = String(v.category || '').toLowerCase();

  let score = 0;
  let matchedTerms = 0;

  for (const term of terms) {
    let matched = false;

    if (keywords.includes(term)) {
      score += 100;
      matched = true;
    } else if (keywords.some(k => k.includes(term))) {
      score += 60;
      matched = true;
    }

    if (title === term) {
      score += 120;
      matched = true;
    } else if (title.includes(term)) {
      score += 80;
      matched = true;
    }

    if (description.includes(term)) {
      score += 35;
      matched = true;
    }

    if (categories.includes(term) || category === term) {
      score += 50;
      matched = true;
    }

    if (matched) matchedTerms++;
  }

  if (matchedTerms === terms.length) score += 40;
  score += matchedTerms * 15;

  return score;
}

function runVideoSearch() {
  const q = searchInput.value;

  if (!q.trim()) {
    renderVideos(allVideos);
    return;
  }

  const ranked = allVideos
    .map(v => ({ video: v, score: scoreVideo(v, q) }))
    .filter(item => item.score > 0)
    .sort((a, b) => b.score - a.score)
    .map(item => item.video);

  renderVideos(ranked);
}

function searchVideos() {
  runVideoSearch();
}

function setupObjectPanelSizer() {
  const handle = objectList.querySelector('.object-panel-resize-handle');
  if (!handle) return;

  const mobile = window.matchMedia('(max-width: 600px)').matches;
  handle.textContent = mobile ? '^' : '‹';
  handle.setAttribute('aria-label', mobile
    ? 'Hold and drag up or down to resize object panel'
    : 'Hold and drag left or right to resize object panel');

  // Keep the current panel size if the model list is rebuilt.
  const current = container.style.getPropertyValue('--object-panel-size');
  let size = current
    ? parseFloat(current)
    : (mobile ? Math.round(window.innerHeight * 0.30) : 190);

  const minSize = mobile ? Math.round(window.innerHeight * 0.15) : 120;
  const maxSize = mobile ? Math.round(window.innerHeight * 0.65) : 500;
  size = Math.max(minSize, Math.min(maxSize, size));

  const applySize = () => {
    // Pixel sizing works for both the desktop sidebar width and mobile panel height.
    container.style.setProperty('--object-panel-size', size + 'px');
  };

  let dragging = false;
  let startCoordinate = 0;
  let startSize = size;

  handle.addEventListener('pointerdown', (event) => {
    dragging = true;
    startCoordinate = mobile ? event.clientY : event.clientX;
    startSize = size;
    handle.setPointerCapture(event.pointerId);
    event.preventDefault();
  });

  handle.addEventListener('pointermove', (event) => {
    if (!dragging) return;
    const coordinate = mobile ? event.clientY : event.clientX;
    const delta = coordinate - startCoordinate;
    size = Math.max(minSize, Math.min(maxSize,
      startSize + (mobile ? -delta : -delta)));
    applySize();
  });

  const stopDragging = () => { dragging = false; };
  handle.addEventListener('pointerup', stopDragging);
  handle.addEventListener('pointercancel', stopDragging);
  handle.addEventListener('lostpointercapture', stopDragging);

  applySize();
}

let transformStartPivotInverse = null;
let transformStartObjects = [];

function getTopLevelSelectedObjects() {
  return Array.from(selectedObjects).filter((object) => {
    let parent = object.parent;
    while (parent && parent !== modelRoot.parent) {
      if (selectedObjects.has(parent)) return false;
      parent = parent.parent;
    }
    return true;
  });
}

function updateTransformPivot() {
  if (!transformPivot || selectedObjects.size === 0) return;
  modelRoot.updateMatrixWorld(true);
  const bounds = new THREE.Box3();
  for (const object of getTopLevelSelectedObjects()) bounds.expandByObject(object);
  if (!bounds.isEmpty()) bounds.getCenter(transformPivot.position);
  transformPivot.quaternion.identity();
  transformPivot.scale.set(1, 1, 1);
  transformPivot.updateMatrixWorld(true);
}

function syncTransformControls() {
  if (!transformControls || !transformPivot) return;
  const canTransform = selectedObjects.size > 0 &&
    (!hasImportedAnimations || !isAnimationPlaying);
  transformToolbar.classList.toggle('is-visible', canTransform);
  if (canTransform) {
    updateTransformPivot();
    transformControls.attach(transformPivot);
  } else {
    transformControls.detach();
  }
}

function restorePausePoseBeforePlayback() {
  for (const [object, pose] of pausePoseBeforeManualTransform) {
    object.position.copy(pose.position);
    object.quaternion.copy(pose.quaternion);
    object.scale.copy(pose.scale);
    object.updateMatrix();
  }
  pausePoseBeforeManualTransform.clear();
}

function applyTransformDelta() {
  if (!transformPivot || !transformStartPivotInverse || !transformStartObjects.length) return;
  transformPivot.updateMatrixWorld(true);
  const delta = new THREE.Matrix4().multiplyMatrices(
    transformPivot.matrixWorld,
    transformStartPivotInverse
  );

  for (const entry of transformStartObjects) {
    const nextWorld = new THREE.Matrix4().multiplyMatrices(delta, entry.worldMatrix);
    const parent = entry.object.parent;
    if (parent) {
      parent.updateMatrixWorld(true);
      const inverseParent = new THREE.Matrix4().copy(parent.matrixWorld).invert();
      const nextLocal = new THREE.Matrix4().multiplyMatrices(inverseParent, nextWorld);
      nextLocal.decompose(entry.object.position, entry.object.quaternion, entry.object.scale);
    } else {
      nextWorld.decompose(entry.object.position, entry.object.quaternion, entry.object.scale);
    }
    entry.object.updateMatrix();
    entry.object.updateMatrixWorld(true);
  }
}

function restoreObjectHighlight() {
  for (const [mesh, originalMaterial] of originalMaterials) {
    mesh.material = originalMaterial;
  }
  originalMaterials.clear();
}

function highlightObject(object) {
  object.traverse((child) => {
    if (!child.isMesh || !child.material) return;

    if (!originalMaterials.has(child)) {
      originalMaterials.set(child, child.material);
    }

    const sourceMaterials = Array.isArray(child.material)
      ? child.material
      : [child.material];

    const highlightedMaterials = sourceMaterials.map((material) => {
      const copy = material.clone();

      if (copy.emissive && typeof copy.emissive.set === 'function') {
        copy.emissive.set(0x00aeca);
        copy.emissiveIntensity = Math.max(
          Number(copy.emissiveIntensity) || 0,
          0.45
        );
      } else if (copy.color && typeof copy.color.lerp === 'function') {
        copy.color = copy.color.clone().lerp(new THREE.Color(0x00d8f5), 0.35);
      }

      return copy;
    });

    child.material = Array.isArray(child.material)
      ? highlightedMaterials
      : highlightedMaterials[0];
  });
}

function isSelectedOrAncestorOfSelection(object) {
  for (const selected of selectedObjects) {
    let node = selected;
    while (node) {
      if (node === object) return true;
      node = node.parent;
    }
  }
  return false;
}

function updateIsolationVisibility() {
  if (!isolateSelectionEnabled || !visibilityBeforeIsolation) return;
  modelObjects.forEach((object) => {
    const originalVisible = visibilityBeforeIsolation.get(object);
    object.visible = Boolean(originalVisible && isSelectedOrAncestorOfSelection(object));
    const row = objectList.querySelector('.model-object-row[data-object-index="' + modelObjects.indexOf(object) + '"]');
    const eye = row?.querySelector('.model-object-visibility');
    if (row) row.classList.toggle('is-hidden', !object.visible);
    if (eye) {
      eye.disabled = !isSelectedOrAncestorOfSelection(object);
      eye.textContent = object.visible ? '◉' : '○';
      eye.setAttribute('aria-pressed', String(object.visible));
      eye.setAttribute('aria-label', (object.visible ? 'Hide ' : 'Show ') + object.name);
      eye.title = object.visible ? 'Hide object' : 'Show object';
    }
  });
}

function setIsolationMode(enabled) {
  if (enabled && selectedObjects.size === 0) return;
  if (enabled && !visibilityBeforeIsolation) {
    visibilityBeforeIsolation = new Map(modelObjects.map((object) => [object, object.visible]));
  }
  isolateSelectionEnabled = enabled;
  if (enabled) {
    updateIsolationVisibility();
  } else if (visibilityBeforeIsolation) {
    modelObjects.forEach((object) => {
      object.visible = visibilityBeforeIsolation.get(object);
      const index = modelObjects.indexOf(object);
      const row = objectList.querySelector('.model-object-row[data-object-index="' + index + '"]');
      const eye = row?.querySelector('.model-object-visibility');
      if (row) row.classList.toggle('is-hidden', !object.visible);
      if (eye) {
        eye.disabled = false;
        eye.textContent = object.visible ? '◉' : '○';
        eye.setAttribute('aria-pressed', String(object.visible));
        eye.setAttribute('aria-label', (object.visible ? 'Hide ' : 'Show ') + object.name);
        eye.title = object.visible ? 'Hide object' : 'Show object';
      }
    });
    visibilityBeforeIsolation = null;
  }
  hideRemainingToggle.setAttribute('aria-pressed', String(enabled));
  hideRemainingToggle.title = enabled
    ? 'Show all objects again'
    : 'Hide all objects except the selected ones';
}

function refreshObjectSelection(scrollToLast = false) {
  restoreObjectHighlight();
  modelObjects.forEach((object, index) => {
    const item = objectList.querySelector('.model-object-name[data-object-index="' + index + '"]');
    if (!item) return;
    const selected = selectedObjects.has(object);
    item.classList.toggle('is-selected', selected);
    item.setAttribute('aria-pressed', String(selected));
    if (selected) highlightObject(object);
  });

  selectionToolbar.classList.toggle('is-visible', selectedObjects.size > 0);
  selectionCountLabel.textContent = selectedObjects.size + (selectedObjects.size === 1 ? ' selected' : ' selected');
  if (scrollToLast && selectedObjects.size) {
    const last = Array.from(selectedObjects).at(-1);
    const item = objectList.querySelector('.model-object-name[data-object-index="' + modelObjects.indexOf(last) + '"]');
    item?.scrollIntoView({ block: 'nearest' });
  }
  if (selectedObjects.size === 0 && isolateSelectionEnabled) {
    setIsolationMode(false);
  } else if (isolateSelectionEnabled) {
    updateIsolationVisibility();
  }
  syncTransformControls();
}

function selectModelObject(object, additive = false) {
  if (!object) return;
  if (additive) {
    if (selectedObjects.has(object)) selectedObjects.delete(object);
    else selectedObjects.add(object);
  } else {
    selectedObjects.clear();
    selectedObjects.add(object);
  }
  refreshObjectSelection(true);
}

objectList.querySelectorAll('.model-object-name').forEach((item) => {
  item.addEventListener('click', (event) => {
    const object = modelObjects[Number(item.dataset.objectIndex)];
    selectModelObject(object, event.ctrlKey || event.metaKey || event.shiftKey);
  });
});

objectList.querySelectorAll('.model-object-visibility').forEach((button) => {
  button.addEventListener('click', () => {
    const index = Number(button.dataset.objectIndex);
    const object = modelObjects[index];
    const row = button.closest('.model-object-row');
    if (!object || !row) return;

    const nextVisible = !(isolateSelectionEnabled && visibilityBeforeIsolation
      ? visibilityBeforeIsolation.get(object)
      : object.visible);
    if (isolateSelectionEnabled && visibilityBeforeIsolation) {
      visibilityBeforeIsolation.set(object, nextVisible);
      updateIsolationVisibility();
    } else {
      object.visible = nextVisible;
      button.textContent = nextVisible ? '◉' : '○';
      button.setAttribute('aria-pressed', String(nextVisible));
      button.setAttribute('aria-label', (nextVisible ? 'Hide ' : 'Show ') + object.name);
      button.title = nextVisible ? 'Hide object' : 'Show object';
      row.classList.toggle('is-hidden', !nextVisible);
    }
  });
});

let scenePointerStart = null;

const rememberScenePointer = (event) => {
  scenePointerStart = { x: event.clientX, y: event.clientY };
};

const selectSceneObject = (event) => {
  if (!scenePointerStart) return;
  if (transformControls && (transformControls.dragging || transformControls.axis !== null)) {
    scenePointerStart = null;
    return;
  }

  const moved = Math.hypot(
    event.clientX - scenePointerStart.x,
    event.clientY - scenePointerStart.y
  );
  scenePointerStart = null;

  // Ignore orbit/pan gestures. Only a simple click selects an object.
  if (moved > 5) return;

  const rect = renderer.domElement.getBoundingClientRect();
  pointerNdc.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  pointerNdc.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(pointerNdc, camera);
  const hits = raycaster.intersectObject(modelRoot, true).filter((hit) => {
    let node = hit.object;
    while (node && node !== modelRoot) {
      if (!node.visible) return false;
      node = node.parent;
    }
    return true;
  });
  if (!hits.length) return;

  let target = hits[0].object;
  while (target && target !== modelRoot && !modelObjects.includes(target)) {
    target = target.parent;
  }

  if (target && target !== modelRoot) {
    selectModelObject(target, event.ctrlKey || event.metaKey || event.shiftKey);
  }
};

function uploadMultipartPart({ token, uploadId, key, partNumber, chunk, onProgress }) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("PUT", R2_UPLOAD_ENDPOINT + "/upload-part", true);
    xhr.timeout = 15 * 60 * 1000;
    xhr.setRequestHeader("Authorization", "Bearer " + token);
    xhr.setRequestHeader("x-upload-id", uploadId);
    xhr.setRequestHeader("x-part-number", String(partNumber));
    xhr.setRequestHeader("x-key", key);
    xhr.setRequestHeader("Content-Type", "application/octet-stream");

    xhr.upload.onprogress = (event) => {
      if (event.lengthComputable && typeof onProgress === "function") {
        onProgress(event.loaded, event.total);
      }
    };

    xhr.onload = () => {
      if (xhr.status < 200 || xhr.status >= 300) {
        reject(new Error("Chunk " + partNumber + " failed (HTTP " + xhr.status + "): " + (xhr.responseText || "Upload rejected")));
        return;
      }
      try {
        const data = JSON.parse(xhr.responseText || "{}");
        if (!data.etag) {
          reject(new Error("Worker did not return an ETag for chunk " + partNumber + "."));
          return;
        }
        resolve(data);
      } catch (err) {
        reject(new Error("Could not read the response for chunk " + partNumber + "."));
      }
    };

    xhr.onerror = () => reject(new Error("Network error while uploading chunk " + partNumber + ". Check the Worker logs, CORS, and your connection."));
    xhr.ontimeout = () => reject(new Error("Chunk " + partNumber + " timed out after 15 minutes."));
    xhr.onabort = () => reject(new Error("Chunk " + partNumber + " was cancelled."));
    xhr.send(chunk);
  });
}

async function uploadToR2(file, progressCallback = null) {

  const user = auth.currentUser;

  if (!user) {
    throw new Error("Not authenticated");
  }

  // Avoid leaving the upload screen waiting forever for Firebase Auth.
  let token;
  let tokenTimer;
  try {
    token = await Promise.race([
      user.getIdToken(true),
      new Promise((_, reject) => {
        tokenTimer = setTimeout(
          () => reject(new Error("Timed out getting your sign-in token. Check your connection and sign in again.")),
          30000
        );
      })
    ]);
  } finally {
    clearTimeout(tokenTimer);
  }

  const safeName =
    Date.now() +
    "_" +
    (file.name || "file")
      .replace(/[^a-zA-Z0-9._-]/g, "");

  // Start the multipart upload. Fail clearly if the Worker does not respond.
  const startController = new AbortController();
  const startTimeout = setTimeout(
    () => startController.abort(),
    2 * 60 * 1000
  );

  let startRes;
  try {
    startRes = await fetch(
      R2_UPLOAD_ENDPOINT + "/create-upload",
      {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          fileName: safeName,
          contentType: file.type || "application/octet-stream"
        }),
        signal: startController.signal
      }
    );
  } catch (err) {
    if (err.name === "AbortError") {
      throw new Error("Starting upload timed out after 2 minutes. Check the Cloudflare Worker.");
    }
    if (err instanceof TypeError && /fetch/i.test(err.message)) {
      throw new Error("Could not reach the upload Worker (fetch failed). This is commonly caused by Worker CORS/preflight settings, a Worker error, or a network block. Check the Worker code and browser Console/Network tab.");
    }
    throw new Error("Could not start upload: " + err.message);
  } finally {
    clearTimeout(startTimeout);
  }

  if (!startRes.ok) {
    throw new Error("Failed to start multipart upload (HTTP " + startRes.status + ")");
  }

  const startData = await startRes.json();
  const uploadId = startData.uploadId;
  const key = startData.key;

  if (!uploadId || !key) {
    throw new Error("Worker did not return an upload ID and file key.");
  }

  // Upload at most two 50 MB parts at a time instead of flooding the browser/Worker.
  const CHUNK_SIZE = 50 * 1024 * 1024;
  const parts = [];
  let uploadedBytes = 0;
  const totalParts = Math.ceil(file.size / CHUNK_SIZE);

  for (let firstPart = 1; firstPart <= totalParts; firstPart += 2) {
    const batch = [];
    const batchLoaded = new Map();

    for (let offset = 0; offset < 2 && firstPart + offset <= totalParts; offset++) {
      const partNumber = firstPart + offset;
      const start = (partNumber - 1) * CHUNK_SIZE;
      const end = Math.min(start + CHUNK_SIZE, file.size);
      const chunk = file.slice(start, end);

      batch.push((async () => {
        const uploadData = await uploadMultipartPart({
          token,
          uploadId,
          key,
          partNumber,
          chunk,
          onProgress: (loaded) => {
            batchLoaded.set(partNumber, loaded);
            const liveBatchBytes = Array.from(batchLoaded.values()).reduce((sum, value) => sum + value, 0);
            const livePercent = Math.min(98, Math.round(((uploadedBytes + liveBatchBytes) / file.size) * 100));
            if (progressCallback) progressCallback(livePercent);
          }
        });

        return {
          partNumber,
          etag: uploadData.etag,
          bytes: end - start
        };
      })());
    }

    const completedBatch = await Promise.all(batch);
    completedBatch.sort((a, b) => a.partNumber - b.partNumber);

    for (const part of completedBatch) {
      uploadedBytes += part.bytes;
      parts.push({
        partNumber: part.partNumber,
        etag: part.etag
      });
    }
    batchLoaded.clear();

    const percent = Math.min(98, Math.round((uploadedBytes / file.size) * 100));
    if (progressCallback) {
      progressCallback(percent);
    }
  }

  // Finish multipart upload. Give the Worker up to 5 minutes to respond.
  const completeController = new AbortController();
  const completeTimeout = setTimeout(
    () => completeController.abort(),
    5 * 60 * 1000
  );

  let completeRes;
  try {
    completeRes = await fetch(
      R2_UPLOAD_ENDPOINT + "/complete-upload",
      {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ uploadId, key, parts }),
        signal: completeController.signal
      }
    );
  } catch (err) {
    if (err.name === "AbortError") {
      throw new Error("Upload parts finished, but finalizing the file timed out after 5 minutes.");
    }
    throw new Error("Could not finalize upload: " + err.message);
  } finally {
    clearTimeout(completeTimeout);
  }

  if (!completeRes.ok) {
    throw new Error("Failed to complete upload (HTTP " + completeRes.status + ")");
  }

  const completeData = await completeRes.json();
  if (!completeData.url || !completeData.key) {
    throw new Error("Worker did not return the completed file URL and key.");
  }

  if (progressCallback) {
    progressCallback(100);
  }

  return {
    url: completeData.url,
    key: completeData.key
  };
}

function generateThumbnailBlob(file, width = 320, height = 180, seekTo = 0.5) {
  return new Promise((resolve, reject) => {

  const timeout = setTimeout(() => {
    cleanup();
    reject(new Error("Thumbnail timeout"));
  }, 10000);

    const url = URL.createObjectURL(file);

    const video = document.createElement("video");

    video.preload = "auto";
    video.src = url;
    video.muted = true;
    video.playsInline = true;

    const cleanup = () => {
  clearTimeout(timeout);
  URL.revokeObjectURL(url);

  video.removeAttribute("src");
  video.load();
};

    video.addEventListener("loadedmetadata", () => {

      const target = Math.min(
        seekTo,
        Math.max(0, video.duration || 0)
      );

      video.currentTime = target;

    }, { once: true });

    video.addEventListener("seeked", () => {

      try {

        const canvas = document.createElement("canvas");

        const vw = video.videoWidth || width;
        const vh = video.videoHeight || height;

        const aspect = vw / vh;

        let cw = width;
        let ch = Math.round(width / aspect);

        if (ch > height) {
          ch = height;
          cw = Math.round(height * aspect);
        }

        canvas.width = cw;
        canvas.height = ch;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(video, 0, 0, cw, ch);

       canvas.toBlob(
  (blob) => {

    cleanup();

    if (blob) {
      resolve(blob);
    } else {
      reject(new Error("Thumbnail generation failed"));
    }

  },
  "image/jpeg",
  0.82
);

      } catch (err) {

  cleanup();
  reject(err);

}

    }, { once: true });

    video.addEventListener("error", (e) => {

  cleanup();
  reject(e);

}, { once: true });

});
}

uploadSubmit.addEventListener('click', async () => {
  try {
    if (!currentUser) {
      alert("Sign in first");
      return;
    }

    const title = uploadTitle.value.trim();
    const description = uploadDescription.value.trim();
    const keywords = normalizeKeywords(uploadKeywords.value);
    const detectedCategories = detectCategories(title, description, keywords);
    const videoFile = uploadVideo.files[0] || null;
    const modelFile = uploadModel.files[0] || null;

    if (!title) {
      alert("Title required");
      return;
    }

    if (!videoFile && !modelFile) {
      alert("Upload a video, a 3D model, or both");
      return;
    }

    uploadStatus.textContent = "Uploading...";

    let videoUrl = "";
    let videoKey = "";
    let videoType = "";
    let modelUrl = "";
    let modelKey = "";
    let thumbnailUrl = "";
    let thumbnailKey = "";



  uploadStatus.textContent = videoFile
    ? "Starting video upload..."
    : "Starting 3D model upload...";

  if (videoFile) {
    // Upload the video first so a thumbnail request cannot make the video
    // appear stuck or compete with the main upload for bandwidth.
    uploadStatus.textContent = "Starting video upload...";

    const video = await uploadToR2(
      videoFile,
      (percent) => {
        uploadStatus.textContent = "Uploading video... " + percent + "%";
      }
    );

    videoUrl = video.url;
    videoKey = video.key;
    videoType = videoFile.type || "video/mp4";
    uploadStatus.textContent = "Video uploaded. Creating thumbnail...";

    // Thumbnail is optional: failure to create/upload it must not block the video.
    const blob = await generateThumbnailBlob(
      videoFile,
      320,
      180,
      0.5
    ).catch(() => null);

    if (blob) {
      try {
        uploadStatus.textContent = "Uploading thumbnail...";
        const thumbFile = new File(
          [blob],
          "thumb_" + Date.now() + ".jpg",
          { type: "image/jpeg" }
        );
        const thumb = await uploadToR2(thumbFile);
        thumbnailUrl = thumb.url;
        thumbnailKey = thumb.key;
      } catch (err) {
        console.warn("Thumbnail upload failed; continuing without thumbnail.", err);
      }
    }
  }

    if (modelFile) {
      uploadStatus.textContent = "Uploading 3D model...";
      const model = await uploadToR2(
        modelFile,
        (percent) => {
          uploadStatus.textContent = "Uploading 3D model... " + percent + "%";
        }
      );
      modelUrl = model.url;
      modelKey = model.key;
    }

    await addDoc(collection(db, "videos"), {
      title,
      description,
      keywords,
      category: detectedCategories.category,
      categories: detectedCategories.categories,
      ownerId: currentUser.uid,
      ownerName: currentUser.displayName || "Unknown",
      uploadDate: serverTimestamp(),
      videoUrl,
      videoKey,
      videoType,
      modelUrl,
      modelKey,
      thumbnailUrl,
      thumbnailKey
    });

    uploadStatus.textContent = "Upload complete";
    uploadTitle.value = "";
    uploadDescription.value = "";
    uploadKeywords.value = "";
    uploadVideo.value = "";
    uploadModel.value = "";
    uploadPanel.style.display = "none";

  } catch (err) {
    console.error(err);
    uploadStatus.textContent = "Upload failed: " + err.message;
  }
});

      if (!confirm("Delete this permanently?")) return;

      try {
        const token = await auth.currentUser.getIdToken(true);
        const keys = [];
        if (v.videoKey) keys.push(v.videoKey);
        if (v.modelKey) keys.push(v.modelKey);
        if (v.thumbnailKey) keys.push(v.thumbnailKey);

        for (const key of keys) {
          const res = await fetch(R2_UPLOAD_ENDPOINT, {
            method: "DELETE",
            headers: {
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ key })
          });

          if (!res.ok) {
            throw new Error("R2 delete failed: " + key);
           }
        }

        await deleteDoc(doc(db, "videos", videoId));
        alert("Deleted");
        goHome();

      } catch (err) {
        console.error(err);
        alert("Delete failed: " + err.message);
      }
    });
  }

  // Wire owner link
  const ownerLink = document.getElementById('videoOwner');
  if (ownerLink) {
    ownerLink.addEventListener('click', e => {
      e.preventDefault();
      loadUserPage(v.ownerId);
    });
  }

  // Initialize 3D viewer if model exists
  if (v.modelUrl) {
    setTimeout(() => {
      load3DViewer(v.modelUrl);
    }, 100);
  }
}

async function goHome() {

  contentArea.innerHTML = `
    <div class="list" id="videoList"></div>
  `;

  const snap = await getDocs(
    query(
      collection(db, "videos"),
      orderBy("uploadDate", "desc")
    )
  );

  const videos = snap.docs.map(d => ({
    id: d.id,
    ...d.data()
  }));

  renderVideos(videos);
}

document.addEventListener('DOMContentLoaded', () => {
  // Nothing special needed
});

</script>
</body>
